name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} unit, typecheck, build, and dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

  integration:
    name: Qdrant v1.17.1 integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.17.1
        ports:
          - 6333:6333
    env:
      PI_QDRANT_MEMORY_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:integration

  compat-pi:
    name: Pi 0.84.1 actual-host compatibility
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install and verify exact Pi host
        shell: bash
        run: |
          set -euo pipefail
          PI_HOST="$RUNNER_TEMP/pi-host"
          mkdir -p "$PI_HOST"
          npm install --prefix "$PI_HOST" --no-save @earendil-works/pi-coding-agent@0.84.1
          node -e 'const p=require(process.argv[1]); if(p.version!=="0.84.1") throw new Error(`wrong Pi version: ${p.version}`)' \
            "$PI_HOST/node_modules/@earendil-works/pi-coding-agent/package.json"
          HOST_INDEX="$PI_HOST/node_modules/@earendil-works/pi-coding-agent/dist/index.js" \
            EXPECTED_HOST=pi \
            node tests/compat/run-host-smoke.mjs

  compat-prime:
    name: Prime a18809e actual-host compatibility
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Build and verify exact Prime host
        shell: bash
        run: |
          set -euo pipefail
          PRIME_HOST="$RUNNER_TEMP/prime-agent"
          PRIME_COMMIT="a18809e00ea30638584d87b3afea7285a9d7296c"
          git clone https://github.com/PrimeIntellect-ai/prime-agent.git "$PRIME_HOST"
          git -C "$PRIME_HOST" checkout --detach "$PRIME_COMMIT"
          test "$(git -C "$PRIME_HOST" rev-parse HEAD)" = "$PRIME_COMMIT"
          npm --prefix "$PRIME_HOST" ci
          npm --prefix "$PRIME_HOST" run build
          HOST_INDEX="$PRIME_HOST/packages/coding-agent/dist/index.js" \
            EXPECTED_HOST=prime \
            node tests/compat/run-host-smoke.mjs
