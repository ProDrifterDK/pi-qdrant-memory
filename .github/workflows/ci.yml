name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Node ${{ matrix.node }} unit, typecheck, build, and dist
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: test "$(npm --version)" = "11.12.1"
      - run: npm ci --include=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

  compat-isolated:
    name: Qdrant 1.17.1 and exact Pi/Prime host smokes
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.12.1
      - run: test "$(npm --version)" = "11.12.1"
      - run: npm ci --include=dev
      - run: bash tests/compat/run-isolated-smokes.sh
